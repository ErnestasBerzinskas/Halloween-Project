<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Bookshelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bookshelf">
        <h1>🎃 SPOOKY SHELF 🎃</h1>

        <div class="decorations">
            <button class="scare-button ghost" onclick="jumpScare()">👻</button>
            <span class="bat">🦇</span>
            <span class="moon">🌙</span>
        </div>

        <div class="books">
            <div class="book book1" tabindex="0" role="button">
                <span>WITCHCRAFT</span>
            </div>
            <div class="book book2" tabindex="0" role="button">
                <span>DARK MAGIC</span>
            </div>
            <div class="book book3" tabindex="0" role="button">
                <span>GHOSTS</span>
            </div>
            <div class="book book4" tabindex="0" role="button">
                <span>CURSES</span>
            </div>
            <div class="book book5" tabindex="0" role="button">
                <span>POTIONS</span>
            </div>
            <div class="book book6" tabindex="0" role="button">
                <span>MYSTERY</span>
            </div>
        </div>

        <div class="shelf"></div>
        <div class="support left"></div>
        <div class="support right"></div>

        <div class="pumpkins">
            <span>🎃</span>
            <span>🕯️</span>
            <span>🎃</span>
        </div>
    </div>

    <div id="scare-screen" onclick="closeScare()">
        <div class="scare-face">😱</div>
        <h2>BOO!!!</h2>
        <p>YOU SHOULD NOT HAVE CLICKED THAT!</p>
        <small>Click anywhere to escape...</small>
    </div>

    <script src="script.js"></script>
</body>
</html>
